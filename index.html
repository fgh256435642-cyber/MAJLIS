<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242832" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('majlis_theme');
          var savedAppearanceMode = localStorage.getItem('majlis_appearance_mode');
          var oldIvoryTheme = theme === 'ivory';
          var migrations = {
            basic: 'classic',
            gold: 'classic',
            ruby: 'classic',
            warm: 'classic',
            forest: 'emerald',
            royal: 'sapphire',
            ocean: 'sapphire'
          };
          var allowed = ['classic', 'emerald', 'sapphire', 'amethyst'];
          if (migrations[theme]) theme = migrations[theme];
          if (allowed.indexOf(theme) === -1) theme = 'classic';
          var appearanceMode = savedAppearanceMode === 'light' || savedAppearanceMode === 'dark'
            ? savedAppearanceMode
            : oldIvoryTheme ? 'light' : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-theme-mode', appearanceMode);
          localStorage.setItem('majlis_theme', theme);
          localStorage.setItem('majlis_appearance_mode', appearanceMode);
          var dark = appearanceMode === 'dark';
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var accent = localStorage.getItem('majlis_accent') || 'theme';
          var accentPresets = ['indigo', 'blue', 'green', 'violet', 'rose', 'amber', 'cyan', 'pink'];
          var customHex = localStorage.getItem('majlis_accent_custom');
          if (accent === 'custom' && /^#[0-9A-Fa-f]{6}$/.test(customHex || '')) {
            root.style.setProperty('--accent', customHex);
            var rgb = parseInt(customHex.slice(1), 16);
            var linear = function (channel) {
              channel /= 255;
              return channel <= 0.04045 ? channel / 12.92 : Math.pow((channel + 0.055) / 1.055, 2.4);
            };
            var luminance =
              0.2126 * linear((rgb >> 16) & 255) +
              0.7152 * linear((rgb >> 8) & 255) +
              0.0722 * linear(rgb & 255);
            root.style.setProperty('--accent-contrast', luminance > 0.179 ? '#000000' : '#FFFFFF');
          } else if (accentPresets.indexOf(accent) !== -1) {
            root.setAttribute('data-accent-preset', accent);
          }
          document.addEventListener('DOMContentLoaded', function () {
            var main = getComputedStyle(root).getPropertyValue('--main').trim();
            var meta = document.querySelector('meta[name="theme-color"]');
            if (main && meta) meta.setAttribute('content', main);
          }, { once: true });
        } catch (_) {}
      })();
    </script>
    <title>مجلس | MAJLIS — مجتمعات الدردشة الفورية والصوت</title>
    <meta name="description" content="منصة مجلس — مجتمعات فورية وقنوات صوتية ومراسلة مباشرة." />
    <meta property="og:title" content="مجلس | MAJLIS — مجتمعات الدردشة الفورية والصوت" />
    <meta property="og:description" content="منصة مجلس — مجتمعات فورية وقنوات صوتية ومراسلة مباشرة." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/majlis-head.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
