name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Publish release
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
          $exe = Get-ChildItem release -Filter "*.exe" | Where-Object { $_.Name -notlike "*setup*blockmap*" } | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "Windows EXE was not generated" }
          $files = @($exe.FullName)
          Get-ChildItem release -Filter "*.blockmap" -ErrorAction SilentlyContinue | ForEach-Object { $files += $_.FullName }
          Get-ChildItem release -Filter "*.yml" -ErrorAction SilentlyContinue | ForEach-Object { $files += $_.FullName }
          gh release upload "$env:GITHUB_REF_NAME" $files --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          npm run build
          npx cap sync android
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk "Majlis-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to GitHub release
        run: gh release upload "$GITHUB_REF_NAME" "Majlis-${GITHUB_REF_NAME}.apk" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
