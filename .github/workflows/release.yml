name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
          $exe = Get-ChildItem release -Filter "Majlis Setup *.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "Majlis Windows EXE was not generated" }
          Copy-Item $exe.FullName "release\Majlis-${env:GITHUB_REF_NAME}.exe"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/Majlis-${{ github.ref_name }}.exe
            release/*.blockmap
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          npm run build
          npx cap sync android
          chmod +x android/gradlew
          android/gradlew -p android assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk "Majlis-${GITHUB_REF_NAME}.apk"

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Majlis-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
